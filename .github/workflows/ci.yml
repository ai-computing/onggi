name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...
      - name: chunker benchmark (reported, not gated yet)
        run: go test -run xxx -bench . -benchtime 3x ./pkg/chunker
      - name: build linux/amd64 CLI
        run: CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o onggi ./cmd/onggi && ./onggi version
