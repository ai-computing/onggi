name: onggi
protocol: "0.1"
layer: l2-memory
kind: tool                    # CLI plus CSI node plugin; controller/compile farm remain planned
summary: Content-addressed artifact store with node cache, peers, delta apply and read-only CSI volumes (P2)
maturity: experimental
hardware: [RNGD, ATOM, A100]  # reads their artifacts; runs on any Linux/Windows host without an accelerator
install:
  - go build -o onggi ./cmd/onggi
test:
  - go vet ./...
  - go test ./...
deploy:
  target: none                # CSI examples require site image/store settings; no automatic deployment
  manifests: null
  image: null
config:
  env_example: null
interfaces:
  provides: []                # ArtifactStore is proposed for rm-core protocol v0.2
  uses: []
kpi: [storage-efficiency, cold-start]
adapters: []                  # Go; no rm-core import
metrics: []
